services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: pitorrent-transmission
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Bangkok
      - USER=
      - PASS=
    volumes:
      - /mnt/pitorrent/data/transmission:/config
      - /mnt/pitorrent/downloads:/downloads
      - /mnt/pitorrent/data/watch:/watch
    expose:
      - "9091"
    ports:
      - "51413:51413"
      - "51413:51413/udp"

  api:
    build: ./api
    container_name: pitorrent-api
    restart: unless-stopped
    environment:
      - TZ=Asia/Bangkok
    volumes:
      - /mnt/pitorrent/downloads/complete:/downloads/complete:ro
      - /mnt/pitorrent/data/subtitles:/data/subtitles
      - /mnt/pitorrent/data/custom-names:/data/custom-names
    expose:
      - "7000"

  web:
    image: nginx:alpine
    container_name: pitorrent-web
    restart: unless-stopped
    depends_on:
      - transmission
      - api
    ports:
      - "80:8080"
      - "8080:8080"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /mnt/pitorrent/downloads/complete:/downloads/complete:ro
