services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: pitorrent-transmission
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Bangkok
      - USER=
      - PASS=
    volumes:
      - /mnt/pitorrent/data/transmission:/config
      - /mnt/pitorrent/downloads:/downloads
      - /mnt/pitorrent/data/watch:/watch
    expose:
      - "9091"
    ports:
      - "51413:51413"
      - "51413:51413/udp"

  addon:
    build: ./addon
    container_name: pitorrent-addon
    restart: unless-stopped
    environment:
      - TZ=Asia/Bangkok
    volumes:
      - /mnt/pitorrent/downloads/complete:/downloads/complete:ro
      - /mnt/pitorrent/data/subtitles:/data/subtitles
    expose:
      - "7000"

  web:
    image: nginx:alpine
    container_name: pitorrent-web
    restart: unless-stopped
    depends_on:
      - transmission
      - addon
    ports:
      - "8080:8080"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /mnt/pitorrent/downloads/complete:/downloads/complete:ro

  playlist-keepalive:
    image: alpine:latest
    container_name: pitorrent-playlist-keepalive
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          date '+%Y-%m-%d %H:%M:%S football.m3u'
          wget --spider -S -T 60 "https://allinone.diep90-nt.workers.dev/football.m3u" 2>&1 || true
          date '+%Y-%m-%d %H:%M:%S tvchannel.m3u'
          wget --spider -S -T 60 "https://allinone.diep90-nt.workers.dev/tvchannel.m3u" 2>&1 || true
          sleep 2
        done
