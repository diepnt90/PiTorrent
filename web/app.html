<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PiTorrent — Download Manager</title>
<style>
:root{--bg:#12181f;--panel:#1a222c;--panel2:#212b37;--line:#2b3742;--text:#dfe6ec;--dim:#7c8b9a;--amber:#e8a33d;--green:#5fb98a;--red:#d9695f;--blue:#5f9cd9;font-size:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,-apple-system,Roboto,Arial,sans-serif;line-height:1.45}.mono{font-family:Consolas,monospace}header{padding:20px 28px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}header h1{font-size:1.25rem;margin:0}header h1 span{color:var(--amber)}#conn-status{font-size:.85rem;color:var(--dim)}#conn-status.ok:before{content:'● ';color:var(--green)}#conn-status.bad:before{content:'● ';color:var(--red)}.wrap{max-width:980px;margin:auto;padding:24px 20px 60px}.add-box{display:flex;gap:10px;margin-bottom:22px}.add-box input,.sub-input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:6px}.btn,.add-box button{background:var(--amber);color:#1a1204;border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}.btn.secondary{background:none;color:var(--dim);border:1px solid var(--line)}.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}.stat,.storage,.torrent{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}.stat .label{color:var(--dim);font-size:.75rem;text-transform:uppercase}.stat .value{font-size:1.3rem;margin-top:4px}.dl{color:var(--green)}.ul{color:var(--blue)}.storage{margin-bottom:26px}.track{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:8px 0}.fill{height:100%;background:var(--blue)}.storage .fill{background:var(--amber)}h2{font-size:.85rem;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:8px;margin:30px 0 12px}.torrent{margin-bottom:10px}.row1{display:flex;justify-content:space-between;gap:10px}.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--dim)}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button,.file-row button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:5px;padding:4px 9px;cursor:pointer}.empty{color:var(--dim);padding:16px;text-align:center}.file-list{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}.file-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:.88rem}.file-info{min-width:0;flex:1}.file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-right{display:flex;align-items:center;gap:10px;flex-shrink:0}.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;padding:20px}.modal-bg.open{display:flex;align-items:center;justify-content:center}.modal{width:min(850px,100%);max-height:90vh;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column}.modal.small{width:min(620px,100%)}.modal-head,.modal-foot,.tools{padding:14px 18px;border-bottom:1px solid var(--line)}.modal-foot{border-top:1px solid var(--line);border-bottom:0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tools{display:flex;gap:8px;flex-wrap:wrap}.picker-list{overflow:auto;max-height:55vh}.picker-row{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:.86rem}.dim{color:var(--dim)}.sub-body{padding:18px}.sub-field{margin-bottom:14px}.sub-field label{display:block;color:var(--dim);font-size:.8rem;margin-bottom:5px}.sub-field input,.sub-field select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px;border-radius:6px}.sub-or{text-align:center;color:var(--dim);margin:5px}.sub-existing{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.sub-item{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:.82rem}.sub-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player-box{display:none;margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}.player-box.open{display:block}.player-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.player-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player-box video{display:block;width:100%;max-height:70vh;background:#000;border-radius:6px}.player-note{margin-top:8px;font-size:.78rem;color:var(--dim)}@media(max-width:700px){.stat-row{grid-template-columns:repeat(2,1fr)}.add-box{flex-direction:column}.file-row{align-items:flex-start}.file-right{flex-direction:column;align-items:flex-end}}
</style></head><body>
<header><h1>Pi<span>Torrent</span></h1><div id="conn-status" class="bad">connecting…</div></header><div class="wrap">
<div class="add-box"><input id="add-input" placeholder="Paste magnet link or .torrent URL"><button id="add-btn" onclick="addTorrent()">Add</button></div>
<div class="stat-row"><div class="stat"><div class="label">Download speed</div><div id="stat-dl" class="value dl mono">0 KB/s</div></div><div class="stat"><div class="label">Upload speed</div><div id="stat-ul" class="value ul mono">0 KB/s</div></div><div class="stat"><div class="label">Active</div><div id="stat-active" class="value mono">0</div></div><div class="stat"><div class="label">Completed</div><div id="stat-done" class="value mono">0</div></div></div>
<div class="storage"><strong>USB Storage</strong> <span id="storage-path" class="dim mono">/downloads/complete</span><div class="track"><div id="storage-fill" class="fill" style="width:0%"></div></div><div id="storage-detail" class="dim mono">Checking…</div></div>
<h2>Downloading / queue</h2><div id="torrent-list"><div class="empty">No torrents yet.</div></div>
<h2>Completed files</h2><div id="finished-list" class="file-list"><div class="empty">No completed files yet.</div></div>
<div id="player-box" class="player-box"><div class="player-head"><strong id="player-title">Player</strong><button class="btn secondary" onclick="closePlayer()">Close</button></div><video id="player" controls playsinline preload="metadata"></video><div id="player-note" class="player-note"></div></div>
</div>
<div id="picker" class="modal-bg"><div class="modal"><div class="modal-head"><strong id="picker-title">Choose files</strong><div id="picker-hint" class="dim">Fetching metadata…</div></div><div class="tools"><button class="btn secondary" onclick="selectMode('all')">Select all</button><button class="btn secondary" onclick="selectMode('video')">Video only</button><button class="btn secondary" onclick="selectMode('none')">Clear</button></div><div id="picker-list" class="picker-list"><div class="empty">Loading metadata…</div></div><div class="modal-foot"><div id="picker-summary" class="dim">—</div><div><button class="btn secondary" onclick="cancelPicker()">Cancel</button> <button id="start-btn" class="btn" onclick="startSelected()" disabled>Start download</button></div></div></div></div>
<div id="sub-modal" class="modal-bg"><div class="modal small"><div class="modal-head"><strong>Add subtitle</strong><div id="sub-video" class="dim"></div></div><div class="sub-body"><div class="sub-field"><label>Language</label><select id="sub-lang"><option value="eng">English</option><option value="vie">Vietnamese</option><option value="jpn">Japanese</option><option value="kor">Korean</option><option value="chi">Chinese</option><option value="und">Other / Unknown</option></select></div><div class="sub-field"><label>Subtitle URL (.srt / .vtt)</label><input id="sub-url" placeholder="https://example.com/subtitle.srt"></div><div class="sub-or">or</div><div class="sub-field"><label>Upload subtitle (.srt / .vtt / .ass / .ssa)</label><input id="sub-upload" type="file" accept=".srt,.vtt,.ass,.ssa"></div><div id="sub-existing" class="sub-existing"></div></div><div class="modal-foot"><span id="sub-status" class="dim"></span><div><button class="btn secondary" onclick="closeSub()">Cancel</button> <button class="btn" onclick="saveSub()">Save</button></div></div></div></div>
<script>
const RPC='/transmission/rpc';let sid=null,pending=null,files=[],subFile=null,pickerMode='add';const $=id=>document.getElementById(id);const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function fmt(b){if(!Number.isFinite(Number(b)))return'0 B';let n=Number(b),u=['B','KB','MB','GB','TB'],i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]))}function enc(s){return encodeURIComponent(s)}function mediaUrl(path){return'/media/'+String(path||'').split('/').map(enc).join('/')}
async function rpc(method,args={}){const h={'Content-Type':'application/json'};if(sid)h['X-Transmission-Session-Id']=sid;let r=await fetch(RPC,{method:'POST',headers:h,body:JSON.stringify({method,arguments:args})});if(r.status===409){sid=r.headers.get('X-Transmission-Session-Id');return rpc(method,args)}if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.result!=='success')throw Error(d.result);$('conn-status').className='ok';$('conn-status').textContent='connected';return d.arguments}
async function addTorrent(){const link=$('add-input').value.trim();if(!link)return;const b=$('add-btn');b.disabled=true;b.textContent='Adding…';try{const r=await rpc('torrent-add',{filename:link,paused:false});const t=r['torrent-added']||r['torrent-duplicate'];if(!t)throw Error('No torrent id returned');pickerMode='add';pending={id:t.id,name:t.name||'Torrent'};$('add-input').value='';openPicker();await rpc('torrent-start',{ids:[pending.id]});await waitMetadata(pending.id)}catch(e){alert('Could not add torrent: '+e.message)}finally{b.disabled=false;b.textContent='Add'}}$('add-input').addEventListener('keydown',e=>{if(e.key==='Enter')addTorrent()});
function openPicker(){$('picker').classList.add('open');$('picker-title').textContent=pending.name;$('picker-hint').textContent=pickerMode==='edit'?'Choose files to download. Files already downloaded are marked ✓.':'Fetching magnet metadata from DHT / peers…';$('picker-list').innerHTML='<div class="empty">Loading metadata…</div>';$('picker-summary').textContent='—';$('start-btn').textContent=pickerMode==='edit'?'Update download':'Start download';$('start-btn').disabled=true}
async function waitMetadata(id){const start=Date.now();for(let i=0;i<240;i++){const r=await rpc('torrent-get',{ids:[id],fields:['id','name','files','metadataPercentComplete','peersConnected','rateDownload']});const t=(r.torrents||[])[0];if(!t)throw Error('Torrent disappeared');const mp=t.metadataPercentComplete||0,sec=Math.floor((Date.now()-start)/1000);$('picker-title').textContent=t.name||pending.name;$('picker-hint').textContent=`Fetching metadata… ${Math.round(mp*100)}% · ${t.peersConnected||0} peers · ${sec}s`;if(mp>=1&&t.files&&t.files.length){await rpc('torrent-stop',{ids:[id]});files=t.files.map((f,index)=>({index,name:f.name,length:f.length,wanted:true,bytesCompleted:0}));$('picker-hint').textContent='Metadata ready. Choose the files you want to download.';renderPicker();return}await sleep(500)}await rpc('torrent-stop',{ids:[id]});$('picker-hint').textContent='Metadata unavailable after 120 seconds.';$('picker-list').innerHTML='<div class="empty">Could not retrieve metadata.</div>'}
async function openEditFiles(id){try{const r=await rpc('torrent-get',{ids:[id],fields:['id','name','files','fileStats']});const t=(r.torrents||[])[0];if(!t)throw Error('Torrent not found');pickerMode='edit';pending={id:t.id,name:t.name||'Torrent'};const ts=t.fileStats||[];files=(t.files||[]).map((f,index)=>{const s=ts[index]||{};return{index,name:f.name,length:f.length,wanted:s.wanted!==false,bytesCompleted:Number(s.bytesCompleted)||0}});openPicker();$('picker-hint').textContent='Choose additional files to download. Completed files are marked ✓.';renderPicker()}catch(e){alert('Could not edit torrent files: '+e.message)}}
function renderPicker(){$('picker-list').innerHTML=files.map(f=>`<label class="picker-row"><input type="checkbox" ${f.wanted?'checked':''} onchange="toggleFile(${f.index},this.checked)"><span>${esc(f.name)}</span><span class="dim mono">${fmt(f.length)}${f.length>0&&f.bytesCompleted>=f.length?' ✓':''}</span></label>`).join('');$('start-btn').disabled=false;summary()}function toggleFile(i,v){const f=files.find(x=>x.index===i);if(f)f.wanted=v;summary()}function selectMode(m){const v=/\.(mkv|mp4|avi|mov|m4v|webm|ts|m2ts|wmv|flv)$/i;files.forEach(f=>f.wanted=m==='all'||(m==='video'&&v.test(f.name)));renderPicker()}function summary(){const s=files.filter(f=>f.wanted);$('picker-summary').textContent=`Selected ${s.length}/${files.length} files · ${fmt(s.reduce((a,f)=>a+f.length,0))}`;$('start-btn').disabled=!s.length}
async function startSelected(){if(!pending)return;const wanted=files.filter(f=>f.wanted).map(f=>f.index),unwanted=files.filter(f=>!f.wanted).map(f=>f.index);const id=pending.id;await rpc('torrent-stop',{ids:[id]});await rpc('torrent-set',{ids:[id],'files-wanted':wanted,'files-unwanted':unwanted});await rpc('torrent-start',{ids:[id]});closePicker();refreshAll()}async function cancelPicker(){if(pending&&pickerMode==='add'){try{await rpc('torrent-remove',{ids:[pending.id],'delete-local-data':true})}catch(e){}}closePicker();refreshAll()}function closePicker(){$('picker').classList.remove('open');pending=null;files=[];pickerMode='add';$('start-btn').textContent='Start download'}
async function pauseResume(id,paused){await rpc(paused?'torrent-start':'torrent-stop',{ids:[id]});refreshAll()}async function removeTorrent(id,del){if(!confirm(del?'Remove torrent and delete files?':'Remove torrent but keep files?'))return;await rpc('torrent-remove',{ids:[id],'delete-local-data':del});refreshAll()}
async function openSub(path){subFile=path;$('sub-video').textContent=path.split('/').pop();$('sub-url').value='';$('sub-upload').value='';$('sub-status').textContent='';$('sub-modal').classList.add('open');await loadSubs()}function closeSub(){$('sub-modal').classList.remove('open');subFile=null}
async function loadSubs(){if(!subFile)return;try{const r=await fetch('/subtitle-api?file='+enc(subFile));const d=await r.json();const a=d.subtitles||[];$('sub-existing').innerHTML=a.length?'<div class="dim">Attached subtitles</div>'+a.map(s=>`<div class="sub-item"><span>${esc(s.lang)} · ${esc(s.name||s.url||s.file||'subtitle')}</span><button onclick="deleteSub('${esc(s.id)}')">Remove</button></div>`).join(''):'<div class="dim">No subtitle attached yet.</div>'}catch(e){$('sub-existing').innerHTML='<div class="dim">Could not load subtitles.</div>'}}
async function saveSub(){if(!subFile)return;const fd=new FormData();fd.append('file',subFile);fd.append('lang',$('sub-lang').value);const url=$('sub-url').value.trim(),up=$('sub-upload').files[0];if(url)fd.append('url',url);else if(up)fd.append('upload',up);else{$('sub-status').textContent='Paste a URL or choose a file.';return}$('sub-status').textContent='Saving…';try{const r=await fetch('/subtitle-api',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'Save failed');$('sub-url').value='';$('sub-upload').value='';$('sub-status').textContent='Saved';await loadSubs()}catch(e){$('sub-status').textContent=e.message}}
async function deleteSub(id){if(!subFile||!confirm('Remove this subtitle?'))return;await fetch('/subtitle-api?file='+enc(subFile)+'&id='+enc(id),{method:'DELETE'});await loadSubs()}
async function openPlayer(path){const box=$('player-box'),v=$('player');v.pause();v.removeAttribute('src');v.innerHTML='';$('player-title').textContent=path.split('/').pop();$('player-note').textContent='Loading subtitles…';box.classList.add('open');v.src=mediaUrl(path);try{const r=await fetch('/subtitle-api?file='+enc(path));const d=await r.json();const a=d.subtitles||[];a.forEach((s,i)=>{const tr=document.createElement('track');tr.kind='subtitles';tr.label=(s.lang||'sub').toUpperCase();tr.srclang=s.lang||'en';tr.src='/player-subtitle?file='+enc(path)+'&id='+enc(s.id);if(i===0)tr.default=true;v.appendChild(tr)});$('player-note').textContent=a.length?`${a.length} subtitle track(s) loaded. Use CC/Subtitles in the player to change track.`:'No subtitle attached to this file.'}catch(e){$('player-note').textContent='Could not load subtitle list.'}v.load();box.scrollIntoView({behavior:'smooth',block:'start'});v.play().catch(()=>{})}
function closePlayer(){const v=$('player');v.pause();v.removeAttribute('src');v.innerHTML='';v.load();$('player-box').classList.remove('open')}
const SM={0:'Paused',1:'Check queued',2:'Checking',3:'Download queued',4:'Downloading',5:'Seed queued',6:'Seeding'};
async function refreshTorrents(){try{const r=await rpc('torrent-get',{fields:['id','name','percentDone','rateDownload','rateUpload','status','peersConnected','sizeWhenDone','downloadedEver','files','fileStats']});let ah='',fh='',dl=0,ul=0,act=0,done=0;(r.torrents||[]).forEach(t=>{dl+=t.rateDownload||0;ul+=t.rateUpload||0;if(t.status===4||t.status===6)act++;const tf=t.files||[],ts=t.fileStats||[];tf.forEach((f,i)=>{const s=ts[i];if(s&&Number(s.bytesCompleted)>=Number(f.length)&&Number(f.length)>0){done++;const p=enc(f.name);fh+=`<div class="file-row"><div class="file-info"><div class="file-name">${esc(f.name.split('/').pop())}</div></div><div class="file-right"><span class="dim mono">${fmt(f.length)}</span><button onclick="openPlayer(decodeURIComponent('${p}'))">Watch Now</button><button onclick="openSub(decodeURIComponent('${p}'))">Add sub</button><button onclick="openEditFiles(${t.id})">Edit files</button></div></div>`}});if(t.percentDone>=1)return;const p=((t.percentDone||0)*100).toFixed(1),paused=t.status===0;ah+=`<div class="torrent"><div class="row1"><div class="name">${esc(t.name)}</div><div class="mono dim">${p}%</div></div><div class="track"><div class="fill" style="width:${p}%"></div></div><div class="meta"><span>${SM[t.status]||'Unknown'}</span><span>↓ <b class="dl mono">${fmt(t.rateDownload)}/s</b></span><span>↑ <b class="ul mono">${fmt(t.rateUpload)}/s</b></span><span>Peers: <b>${t.peersConnected}</b></span><span class="mono">${fmt(t.downloadedEver)} / ${fmt(t.sizeWhenDone)}</span><span class="actions"><button onclick="pauseResume(${t.id},${paused})">${paused?'Resume':'Pause'}</button><button onclick="openEditFiles(${t.id})">Edit files</button><button onclick="removeTorrent(${t.id},false)">Remove</button><button onclick="removeTorrent(${t.id},true)">Remove + files</button></span></div></div>`});$('torrent-list').innerHTML=ah||'<div class="empty">No torrents downloading right now.</div>';$('finished-list').innerHTML=fh||'<div class="empty">No completed files yet.</div>';$('stat-dl').textContent=fmt(dl)+'/s';$('stat-ul').textContent=fmt(ul)+'/s';$('stat-active').textContent=act;$('stat-done').textContent=done}catch(e){$('conn-status').className='bad';$('conn-status').textContent='RPC error: '+e.message}}
async function refreshStorage(){try{const s=await rpc('session-get');const path=s['download-dir']||'/downloads/complete';$('storage-path').textContent=path;const r=await rpc('free-space',{path});const free=r['size-bytes'];$('storage-detail').textContent='Free space: '+fmt(free);const gb=free/1e9;$('storage-fill').style.width=(gb<5?95:gb<20?75:40)+'%'}catch(e){$('storage-detail').textContent='Storage unavailable: '+e.message}}async function refreshAll(){await refreshTorrents();await refreshStorage()}refreshAll();setInterval(()=>{if(!$('picker').classList.contains('open')&&!$('sub-modal').classList.contains('open'))refreshAll()},2000);
</script></body></html>
