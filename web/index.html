<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torrent Station — Download Manager</title>
<style>
  :root{
    --bg:#12181f;
    --panel:#1a222c;
    --panel-2:#212b37;
    --line:#2b3742;
    --text:#dfe6ec;
    --dim:#7c8b9a;
    --amber:#e8a33d;
    --amber-dim:#5c4a28;
    --green:#5fb98a;
    --red:#d9695f;
    --blue:#5f9cd9;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",-apple-system,Roboto,Arial,sans-serif;line-height:1.45;}
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}
  header{padding:20px 28px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  header h1{font-size:1.25rem;font-weight:600;margin:0;letter-spacing:.2px;}
  header h1 span{color:var(--amber);}
  #conn-status{font-size:.85rem;color:var(--dim);}
  #conn-status.ok::before{content:"● ";color:var(--green);}
  #conn-status.bad::before{content:"● ";color:var(--red);}
  #conn-status.wait::before{content:"● ";color:var(--amber);}
  .wrap{max-width:980px;margin:0 auto;padding:24px 20px 60px;}
  .add-box{display:flex;gap:10px;margin-bottom:22px;}
  .add-box input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:6px;font-size:.95rem;}
  .add-box input:focus{outline:2px solid var(--blue);outline-offset:-1px;}
  .add-box button{background:var(--amber);color:#1a1204;border:none;padding:0 22px;border-radius:6px;font-weight:600;cursor:pointer;font-size:.95rem;}
  .add-box button:hover{filter:brightness(1.08);}
  .add-box button:active{transform:translateY(1px);}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;}
  .stat .label{color:var(--dim);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;}
  .stat .value{font-size:1.3rem;margin-top:4px;}
  .stat .value.dl{color:var(--green);}
  .stat .value.ul{color:var(--blue);}
  .storage-bar{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:26px;}
  .storage-bar .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
  .storage-bar .top .path{color:var(--dim);font-size:.82rem;}
  .storage-bar .track{height:10px;background:var(--panel-2);border-radius:5px;overflow:hidden;}
  .storage-bar .fill{height:100%;background:var(--amber);transition:width .4s;}
  .storage-bar .fill.warn{background:var(--red);}
  select#disk-select{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:.82rem;}
  h2.section{font-size:.85rem;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin:30px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px;}
  .torrent{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;}
  .torrent .row1{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px;}
  .torrent .name{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .torrent .pct{color:var(--dim);font-size:.85rem;flex-shrink:0;}
  .track{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin-bottom:9px;}
  .track .fill{height:100%;background:var(--blue);}
  .track .fill.done{background:var(--green);}
  .track .fill.paused{background:var(--dim);}
  .torrent .meta{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--dim);}
  .torrent .meta b{color:var(--text);font-weight:600;}
  .torrent .meta .dl b{color:var(--green);}
  .torrent .meta .ul b{color:var(--blue);}
  .torrent .actions{display:flex;gap:6px;}
  .torrent .actions button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:5px;padding:3px 9px;font-size:.75rem;cursor:pointer;}
  .torrent .actions button:hover{color:var(--text);border-color:var(--dim);}
  .torrent .actions button.danger:hover{color:var(--red);border-color:var(--red);}
  .file-list{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .file-row{display:flex;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:.88rem;}
  .file-row:last-child{border-bottom:none;}
  .file-row .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .file-row .fsize{color:var(--dim);flex-shrink:0;}
  .empty{color:var(--dim);font-size:.88rem;padding:16px;text-align:center;}
  .cfg-toggle{background:none;border:none;color:var(--dim);font-size:.8rem;cursor:pointer;text-decoration:underline;padding:0;}
  .cfg-panel{display:none;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:20px;font-size:.85rem;}
  .cfg-panel.open{display:block;}
  .cfg-panel label{display:block;color:var(--dim);margin:10px 0 4px;}
  .cfg-panel input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:5px;font-size:.85rem;}
  .cfg-panel .save-row{margin-top:12px;display:flex;gap:8px;}
  .cfg-panel button{background:var(--amber);color:#1a1204;border:none;padding:7px 16px;border-radius:5px;cursor:pointer;font-weight:600;font-size:.82rem;}
  @media (max-width:700px){.stat-row{grid-template-columns:repeat(2,1fr)}.add-box{flex-direction:column}.add-box button{padding:12px 22px}}
</style>
</head>
<body>
<header>
  <h1>Pi<span>Torrent</span></h1>
  <div><span id="conn-status" class="wait">connecting…</span>&nbsp;·&nbsp;<button class="cfg-toggle" onclick="toggleCfg()">connection settings</button></div>
</header>
<div class="wrap">
  <div class="cfg-panel" id="cfg-panel">
    <label>Transmission RPC address</label>
    <input id="cfg-url" placeholder="/transmission/rpc">
    <label>Username (optional)</label>
    <input id="cfg-user" placeholder="username">
    <label>Password</label>
    <input id="cfg-pass" type="password" placeholder="password">
    <div class="save-row"><button onclick="saveCfg()">Save &amp; reconnect</button></div>
  </div>
  <div class="add-box"><input id="add-input" type="text" placeholder="Paste a magnet: link or .torrent URL here and press Enter"><button onclick="addTorrent()">Add</button></div>
  <div class="stat-row">
    <div class="stat"><div class="label">Download speed</div><div class="value dl mono" id="stat-dl">0 KB/s</div></div>
    <div class="stat"><div class="label">Upload speed</div><div class="value ul mono" id="stat-ul">0 KB/s</div></div>
    <div class="stat"><div class="label">Active</div><div class="value mono" id="stat-active">0</div></div>
    <div class="stat"><div class="label">Completed</div><div class="value mono" id="stat-done">0</div></div>
  </div>
  <div class="storage-bar">
    <div class="top"><div><strong>USB Storage</strong> <span class="path mono" id="storage-path"></span></div><select id="disk-select" onchange="onDiskChange()"></select></div>
    <div class="track"><div class="fill" id="storage-fill" style="width:0%"></div></div>
    <div class="top" style="margin-top:6px;margin-bottom:0;"><span class="path mono" id="storage-detail">—</span></div>
  </div>
  <h2 class="section">Downloading / queue</h2><div id="torrent-list"><div class="empty">No torrents yet.</div></div>
  <h2 class="section">Completed files</h2><div class="file-list" id="finished-list"><div class="empty">No completed files yet.</div></div>
</div>
<script>
let RPC_URL = localStorage.getItem('rpc_url') || '/transmission/rpc';
let RPC_USER = localStorage.getItem('rpc_user') || '';
let RPC_PASS = localStorage.getItem('rpc_pass') || '';
let sessionId = null;
function fmtBytes(b){if(b===undefined||b===null||isNaN(b))return'0 B';const units=['B','KB','MB','GB','TB'];let i=0;b=Number(b);while(b>=1024&&i<units.length-1){b/=1024;i++;}return b.toFixed(i===0?0:1)+' '+units[i];}
function fmtSpeed(b){return fmtBytes(b)+'/s';}
async function rpcCall(method,args={}){const headers={'Content-Type':'application/json'};if(sessionId)headers['X-Transmission-Session-Id']=sessionId;if(RPC_USER)headers['Authorization']='Basic '+btoa(RPC_USER+':'+RPC_PASS);let resp;try{resp=await fetch(RPC_URL,{method:'POST',headers,body:JSON.stringify({method,arguments:args})});}catch(e){setStatus('bad','connection failed');throw e;}if(resp.status===409){sessionId=resp.headers.get('X-Transmission-Session-Id');return rpcCall(method,args);}if(resp.status===401){setStatus('bad','wrong RPC username / password');throw new Error('auth failed');}if(!resp.ok){setStatus('bad','RPC error: HTTP '+resp.status);throw new Error('rpc http '+resp.status);}const data=await resp.json();if(data.result!=='success'){setStatus('bad','RPC error: '+data.result);throw new Error(data.result);}setStatus('ok','connected');return data.arguments;}
function setStatus(cls,text){const el=document.getElementById('conn-status');el.className=cls;el.textContent=text;}
function toggleCfg(){const p=document.getElementById('cfg-panel');p.classList.toggle('open');if(p.classList.contains('open')){document.getElementById('cfg-url').value=RPC_URL;document.getElementById('cfg-user').value=RPC_USER;document.getElementById('cfg-pass').value=RPC_PASS;}}
function saveCfg(){RPC_URL=document.getElementById('cfg-url').value.trim()||'/transmission/rpc';RPC_USER=document.getElementById('cfg-user').value.trim();RPC_PASS=document.getElementById('cfg-pass').value;localStorage.setItem('rpc_url',RPC_URL);localStorage.setItem('rpc_user',RPC_USER);localStorage.setItem('rpc_pass',RPC_PASS);sessionId=null;document.getElementById('cfg-panel').classList.remove('open');refreshAll();}
async function addTorrent(){const input=document.getElementById('add-input');const link=input.value.trim();if(!link)return;try{await rpcCall('torrent-add',{filename:link});input.value='';refreshTorrents();}catch(e){alert('Could not add the torrent. Check the link or RPC connection.');}}
document.getElementById('add-input').addEventListener('keydown',e=>{if(e.key==='Enter')addTorrent();});
async function pauseResume(id,isPaused){await rpcCall(isPaused?'torrent-start':'torrent-stop',{ids:[id]});refreshTorrents();}
async function removeTorrent(id,deleteData){if(!confirm(deleteData?'Remove the torrent and delete its data from disk?':'Remove the torrent from the list (keep the files)?'))return;await rpcCall('torrent-remove',{ids:[id],'delete-local-data':deleteData});refreshTorrents();}
const STATUS_MAP={0:'Paused',1:'Waiting to check',2:'Checking',3:'Queued',4:'Downloading',5:'Waiting to seed',6:'Seeding'};
async function refreshTorrents(){let args;try{args=await rpcCall('torrent-get',{fields:['id','name','percentDone','rateDownload','rateUpload','status','peersConnected','peersSendingToUs','peersGettingFromUs','sizeWhenDone','totalSize','downloadedEver','eta','error','errorString','trackerStats','files','isFinished']});}catch(e){return;}const torrents=args.torrents||[];let totalDl=0,totalUl=0,active=0,doneCount=0;const listEl=document.getElementById('torrent-list');const finEl=document.getElementById('finished-list');let finishedHtml='',activeHtml='';torrents.forEach(t=>{totalDl+=t.rateDownload;totalUl+=t.rateUpload;if(t.rateDownload>0||t.rateUpload>0)active++;let seeds=0,leechers=0;(t.trackerStats||[]).forEach(ts=>{seeds=Math.max(seeds,ts.seederCount);leechers=Math.max(leechers,ts.leecherCount);});const isDone=t.percentDone>=1;if(isDone){doneCount++;(t.files||[]).forEach(f=>{finishedHtml+=`<div class="file-row"><span class="fname">${escapeHtml(f.name.split('/').pop())}</span><span class="fsize mono">${fmtBytes(f.length)}</span></div>`;});return;}const pct=(t.percentDone*100).toFixed(1);const isPaused=t.status===0;activeHtml+=`<div class="torrent"><div class="row1"><div class="name" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</div><div class="pct mono">${pct}%</div></div><div class="track"><div class="fill ${isPaused?'paused':''}" style="width:${pct}%"></div></div><div class="meta"><span>${STATUS_MAP[t.status]||'Unknown'}</span><span class="dl">↓ <b class="mono">${fmtSpeed(t.rateDownload)}</b></span><span class="ul">↑ <b class="mono">${fmtSpeed(t.rateUpload)}</b></span><span>Peers: <b>${t.peersConnected}</b></span><span>Swarm seeds: <b>${seeds}</b> · Leechers: <b>${leechers}</b></span><span class="mono">${fmtBytes(t.downloadedEver)} / ${fmtBytes(t.sizeWhenDone)}</span>${t.error?`<span style="color:var(--red)">Error: ${escapeHtml(t.errorString)}</span>`:''}<span class="actions"><button onclick="pauseResume(${t.id}, ${isPaused})">${isPaused?'Resume':'Pause'}</button><button class="danger" onclick="removeTorrent(${t.id}, false)">Remove</button><button class="danger" onclick="removeTorrent(${t.id}, true)">Remove + files</button></span></div></div>`;});listEl.innerHTML=activeHtml||'<div class="empty">No torrents downloading right now.</div>';finEl.innerHTML=finishedHtml||'<div class="empty">No completed files yet.</div>';document.getElementById('stat-dl').textContent=fmtSpeed(totalDl);document.getElementById('stat-ul').textContent=fmtSpeed(totalUl);document.getElementById('stat-active').textContent=active;document.getElementById('stat-done').textContent=doneCount;}
function escapeHtml(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let watchedPaths=JSON.parse(localStorage.getItem('watched_paths')||'null');
async function initDiskPaths(){try{const s=await rpcCall('session-get',{});const dlDir=s['download-dir'];if(!watchedPaths){watchedPaths=[dlDir];localStorage.setItem('watched_paths',JSON.stringify(watchedPaths));}}catch(e){}renderDiskSelect();}
function renderDiskSelect(){const sel=document.getElementById('disk-select');sel.innerHTML=(watchedPaths||[]).map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')+`<option value="__add__">+ Add another path…</option>`;}
function onDiskChange(){const sel=document.getElementById('disk-select');if(sel.value==='__add__'){const p=prompt('Enter mounted folder path, e.g. /downloads');if(p){watchedPaths.push(p);localStorage.setItem('watched_paths',JSON.stringify(watchedPaths));renderDiskSelect();sel.value=p;}else{sel.selectedIndex=0;}}refreshStorage();}
async function refreshStorage(){const sel=document.getElementById('disk-select');const path=sel.value&&sel.value!=='__add__'?sel.value:(watchedPaths||[])[0];if(!path)return;document.getElementById('storage-path').textContent=path;try{const r=await rpcCall('free-space',{path});const free=r['size-bytes'];document.getElementById('storage-detail').textContent=`Free space: ${fmtBytes(free)}`;const fill=document.getElementById('storage-fill');const gb=free/1e9;let pctFill,warn=false;if(gb<2){pctFill=98;warn=true;}else if(gb<5){pctFill=95;warn=true;}else if(gb<20){pctFill=75;warn=true;}else if(gb<100){pctFill=40;}else{pctFill=15;}fill.style.width=pctFill+'%';fill.className='fill'+(warn?' warn':'');}catch(e){document.getElementById('storage-detail').textContent='Could not read free space for this path.';}}
async function refreshAll(){await refreshTorrents();await refreshStorage();}
initDiskPaths().then(refreshAll);setInterval(refreshAll,2000);
</script>
</body>
</html>
