<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiTorrent — Download Manager</title>
<style>
:root{--bg:#12181f;--panel:#1a222c;--panel-2:#212b37;--line:#2b3742;--text:#dfe6ec;--dim:#7c8b9a;--amber:#e8a33d;--green:#5fb98a;--red:#d9695f;--blue:#5f9cd9;font-size:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",-apple-system,Roboto,Arial,sans-serif;line-height:1.45}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}header{padding:20px 28px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px}header h1{font-size:1.25rem;font-weight:600;margin:0}header h1 span{color:var(--amber)}#conn-status{font-size:.85rem;color:var(--dim)}#conn-status.ok::before{content:"● ";color:var(--green)}#conn-status.bad::before{content:"● ";color:var(--red)}#conn-status.wait::before{content:"● ";color:var(--amber)}.wrap{max-width:980px;margin:0 auto;padding:24px 20px 60px}.add-box{display:flex;gap:10px;margin-bottom:22px}.add-box input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:6px;font-size:.95rem}.add-box input:focus{outline:2px solid var(--blue);outline-offset:-1px}.add-box button,.primary{background:var(--amber);color:#1a1204;border:none;padding:0 22px;border-radius:6px;font-weight:600;cursor:pointer;font-size:.95rem}.add-box button:hover,.primary:hover{filter:brightness(1.08)}.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}.stat .label{color:var(--dim);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}.stat .value{font-size:1.3rem;margin-top:4px}.stat .value.dl{color:var(--green)}.stat .value.ul{color:var(--blue)}.storage-bar{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:26px}.storage-bar .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:6px}.storage-bar .path{color:var(--dim);font-size:.82rem}.storage-bar .track,.track{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin-bottom:9px}.storage-bar .track{height:10px;margin-bottom:0}.storage-bar .fill{height:100%;background:var(--amber);transition:width .4s}.storage-bar .fill.warn{background:var(--red)}select#disk-select{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:.82rem}h2.section{font-size:.85rem;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin:30px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}.torrent{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px}.torrent .row1{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.torrent .name{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.torrent .pct{color:var(--dim);font-size:.85rem;flex-shrink:0}.track .fill{height:100%;background:var(--blue)}.track .fill.paused{background:var(--dim)}.torrent .meta{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--dim)}.torrent .meta b{color:var(--text)}.torrent .meta .dl b{color:var(--green)}.torrent .meta .ul b{color:var(--blue)}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button,.secondary{background:none;border:1px solid var(--line);color:var(--dim);border-radius:5px;padding:5px 10px;font-size:.78rem;cursor:pointer}.actions button:hover,.secondary:hover{color:var(--text);border-color:var(--dim)}.actions button.danger:hover{color:var(--red);border-color:var(--red)}.file-list{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}.file-row{display:flex;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:.88rem}.file-row:last-child{border-bottom:none}.file-row .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-row .fsize{color:var(--dim);flex-shrink:0}.empty{color:var(--dim);font-size:.88rem;padding:16px;text-align:center}.cfg-toggle{background:none;border:none;color:var(--dim);font-size:.8rem;cursor:pointer;text-decoration:underline;padding:0}.cfg-panel{display:none;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:20px;font-size:.85rem}.cfg-panel.open{display:block}.cfg-panel label{display:block;color:var(--dim);margin:10px 0 4px}.cfg-panel input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:5px}.cfg-panel .save-row{margin-top:12px}.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:1000;padding:24px}.modal-backdrop.open{display:flex;align-items:center;justify-content:center}.modal{width:min(820px,100%);max-height:88vh;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;box-shadow:0 20px 70px rgba(0,0,0,.45)}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0 0 5px;font-size:1rem}.modal-head .hint{color:var(--dim);font-size:.8rem}.select-tools{display:flex;gap:7px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line)}.picker-list{overflow:auto;min-height:130px;max-height:52vh}.picker-row{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);font-size:.86rem}.picker-row:hover{background:var(--panel-2)}.picker-name{overflow-wrap:anywhere}.picker-size{color:var(--dim);white-space:nowrap}.modal-foot{padding:13px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);flex-wrap:wrap}.modal-foot .summary{font-size:.82rem;color:var(--dim)}.modal-foot .buttons{display:flex;gap:8px}.modal-foot .primary{padding:8px 16px}.loading{padding:28px;text-align:center;color:var(--dim)}@media(max-width:700px){.stat-row{grid-template-columns:repeat(2,1fr)}.add-box{flex-direction:column}.add-box button{padding:12px 22px}.modal-backdrop{padding:10px}.picker-row{padding:9px 12px}}
</style>
</head>
<body>
<header><h1>Pi<span>Torrent</span></h1><div><span id="conn-status" class="wait">connecting…</span>&nbsp;·&nbsp;<button class="cfg-toggle" onclick="toggleCfg()">connection settings</button></div></header>
<div class="wrap">
<div class="cfg-panel" id="cfg-panel"><label>Transmission RPC address</label><input id="cfg-url" placeholder="/transmission/rpc"><label>Username (optional)</label><input id="cfg-user"><label>Password</label><input id="cfg-pass" type="password"><div class="save-row"><button class="primary" style="padding:7px 16px" onclick="saveCfg()">Save & reconnect</button></div></div>
<div class="add-box"><input id="add-input" type="text" placeholder="Paste a magnet: link or .torrent URL here and press Enter"><button id="add-btn" onclick="addTorrent()">Add</button></div>
<div class="stat-row"><div class="stat"><div class="label">Download speed</div><div class="value dl mono" id="stat-dl">0 KB/s</div></div><div class="stat"><div class="label">Upload speed</div><div class="value ul mono" id="stat-ul">0 KB/s</div></div><div class="stat"><div class="label">Active</div><div class="value mono" id="stat-active">0</div></div><div class="stat"><div class="label">Completed</div><div class="value mono" id="stat-done">0</div></div></div>
<div class="storage-bar"><div class="top"><div><strong>USB Storage</strong> <span class="path mono" id="storage-path"></span></div><select id="disk-select" onchange="onDiskChange()"></select></div><div class="track"><div class="fill" id="storage-fill" style="width:0%"></div></div><div class="top" style="margin-top:6px;margin-bottom:0"><span class="path mono" id="storage-detail">—</span></div></div>
<h2 class="section">Downloading / queue</h2><div id="torrent-list"><div class="empty">No torrents yet.</div></div>
<h2 class="section">Completed files</h2><div class="file-list" id="finished-list"><div class="empty">No completed files yet.</div></div>
</div>
<div class="modal-backdrop" id="picker"><div class="modal"><div class="modal-head"><h3 id="picker-title">Choose files</h3><div class="hint" id="picker-hint">Waiting for torrent metadata…</div></div><div class="select-tools"><button class="secondary" onclick="selectMode('all')">Select all</button><button class="secondary" onclick="selectMode('video')">Video only</button><button class="secondary" onclick="selectMode('none')">Clear</button></div><div class="picker-list" id="picker-list"><div class="loading">Loading metadata…</div></div><div class="modal-foot"><div class="summary" id="picker-summary">—</div><div class="buttons"><button class="secondary" onclick="cancelPicker()">Cancel</button><button class="primary" id="start-btn" onclick="startSelected()">Start download</button></div></div></div></div>
<script>
let RPC_URL=localStorage.getItem('rpc_url')||'/transmission/rpc',RPC_USER=localStorage.getItem('rpc_user')||'',RPC_PASS=localStorage.getItem('rpc_pass')||'',sessionId=null,pendingTorrent=null,pendingFiles=[];
function fmtBytes(b){if(b===undefined||b===null||isNaN(b))return'0 B';const u=['B','KB','MB','GB','TB'];let i=0;b=Number(b);while(b>=1024&&i<u.length-1){b/=1024;i++}return b.toFixed(i===0?0:1)+' '+u[i]}function fmtSpeed(b){return fmtBytes(b)+'/s'}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function rpcCall(method,args={}){const headers={'Content-Type':'application/json'};if(sessionId)headers['X-Transmission-Session-Id']=sessionId;if(RPC_USER)headers.Authorization='Basic '+btoa(RPC_USER+':'+RPC_PASS);let resp;try{resp=await fetch(RPC_URL,{method:'POST',headers,body:JSON.stringify({method,arguments:args})})}catch(e){setStatus('bad','connection failed');throw e}if(resp.status===409){sessionId=resp.headers.get('X-Transmission-Session-Id');return rpcCall(method,args)}if(resp.status===401){setStatus('bad','wrong RPC username / password');throw Error('auth failed')}if(!resp.ok){setStatus('bad','RPC error: HTTP '+resp.status);throw Error('rpc http '+resp.status)}const data=await resp.json();if(data.result!=='success'){setStatus('bad','RPC error: '+data.result);throw Error(data.result)}setStatus('ok','connected');return data.arguments}
function setStatus(c,t){const e=document.getElementById('conn-status');e.className=c;e.textContent=t}function escapeHtml(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleCfg(){const p=document.getElementById('cfg-panel');p.classList.toggle('open');if(p.classList.contains('open')){document.getElementById('cfg-url').value=RPC_URL;document.getElementById('cfg-user').value=RPC_USER;document.getElementById('cfg-pass').value=RPC_PASS}}function saveCfg(){RPC_URL=document.getElementById('cfg-url').value.trim()||'/transmission/rpc';RPC_USER=document.getElementById('cfg-user').value.trim();RPC_PASS=document.getElementById('cfg-pass').value;localStorage.setItem('rpc_url',RPC_URL);localStorage.setItem('rpc_user',RPC_USER);localStorage.setItem('rpc_pass',RPC_PASS);sessionId=null;document.getElementById('cfg-panel').classList.remove('open');refreshAll()}
async function addTorrent(){const input=document.getElementById('add-input'),btn=document.getElementById('add-btn'),link=input.value.trim();if(!link)return;btn.disabled=true;btn.textContent='Adding…';try{const r=await rpcCall('torrent-add',{filename:link,paused:true});const t=r['torrent-added']||r['torrent-duplicate'];if(!t)throw Error('Transmission did not return torrent id');pendingTorrent={id:t.id,name:t.name||'Torrent'};input.value='';openPicker();await waitForMetadata(t.id)}catch(e){alert('Could not add torrent: '+e.message);if(pendingTorrent)await cancelPicker(true)}finally{btn.disabled=false;btn.textContent='Add'}}document.getElementById('add-input').addEventListener('keydown',e=>{if(e.key==='Enter')addTorrent()});
function openPicker(){document.getElementById('picker').classList.add('open');document.getElementById('picker-title').textContent=pendingTorrent.name;document.getElementById('picker-hint').textContent='Waiting for magnet metadata…';document.getElementById('picker-list').innerHTML='<div class="loading">Loading metadata from peers…</div>';document.getElementById('picker-summary').textContent='—';document.getElementById('start-btn').disabled=true}
async function waitForMetadata(id){for(let n=0;n<120;n++){const r=await rpcCall('torrent-get',{ids:[id],fields:['id','name','files','metadataPercentComplete']});const t=(r.torrents||[])[0];if(!t)throw Error('Torrent disappeared');document.getElementById('picker-title').textContent=t.name||pendingTorrent.name;const mp=t.metadataPercentComplete||0;document.getElementById('picker-hint').textContent=mp<1?'Fetching metadata… '+Math.round(mp*100)+'%':'Choose the files you want to download';if(mp>=1&&t.files&&t.files.length){pendingFiles=t.files.map((f,i)=>({index:i,name:f.name,length:f.length,wanted:true}));renderPicker();return}await sleep(1000)}throw Error('Timed out waiting for magnet metadata')}
function renderPicker(){document.getElementById('picker-list').innerHTML=pendingFiles.map(f=>`<label class="picker-row"><input type="checkbox" data-index="${f.index}" ${f.wanted?'checked':''} onchange="toggleFile(${f.index},this.checked)"><span class="picker-name">${escapeHtml(f.name)}</span><span class="picker-size mono">${fmtBytes(f.length)}</span></label>`).join('');document.getElementById('start-btn').disabled=false;updateSummary()}
function toggleFile(i,v){const f=pendingFiles.find(x=>x.index===i);if(f)f.wanted=v;updateSummary()}function selectMode(mode){const video=/\.(mkv|mp4|avi|mov|m4v|webm|ts|m2ts|wmv|flv)$/i;pendingFiles.forEach(f=>f.wanted=mode==='all'||(mode==='video'&&video.test(f.name)));renderPicker()}function updateSummary(){const a=pendingFiles.filter(f=>f.wanted),bytes=a.reduce((s,f)=>s+f.length,0),total=pendingFiles.reduce((s,f)=>s+f.length,0);document.getElementById('picker-summary').textContent=`Selected: ${a.length}/${pendingFiles.length} files · ${fmtBytes(bytes)} / ${fmtBytes(total)}`;document.getElementById('start-btn').disabled=!a.length}
async function startSelected(){if(!pendingTorrent)return;const wanted=pendingFiles.filter(f=>f.wanted).map(f=>f.index),unwanted=pendingFiles.filter(f=>!f.wanted).map(f=>f.index);if(!wanted.length)return;const btn=document.getElementById('start-btn');btn.disabled=true;btn.textContent='Starting…';try{await rpcCall('torrent-set',{ids:[pendingTorrent.id],'files-wanted':wanted,'files-unwanted':unwanted});await rpcCall('torrent-start',{ids:[pendingTorrent.id]});closePicker();refreshTorrents()}catch(e){alert('Could not start torrent: '+e.message);btn.disabled=false}finally{btn.textContent='Start download'}}async function cancelPicker(silent=false){if(pendingTorrent){try{await rpcCall('torrent-remove',{ids:[pendingTorrent.id],'delete-local-data':true})}catch(e){if(!silent)alert('Could not remove pending torrent')}}closePicker();refreshTorrents()}function closePicker(){document.getElementById('picker').classList.remove('open');pendingTorrent=null;pendingFiles=[]}
async function pauseResume(id,p){await rpcCall(p?'torrent-start':'torrent-stop',{ids:[id]});refreshTorrents()}async function removeTorrent(id,d){if(!confirm(d?'Remove torrent and delete its data?':'Remove torrent but keep files?'))return;await rpcCall('torrent-remove',{ids:[id],'delete-local-data':d});refreshTorrents()}const STATUS_MAP={0:'Paused',1:'Waiting to check',2:'Checking',3:'Queued',4:'Downloading',5:'Waiting to seed',6:'Seeding'};
async function refreshTorrents(){let a;try{a=await rpcCall('torrent-get',{fields:['id','name','percentDone','rateDownload','rateUpload','status','peersConnected','sizeWhenDone','downloadedEver','error','errorString','trackerStats','files']})}catch(e){return}const ts=a.torrents||[];let dl=0,ul=0,active=0,done=0,ah='',fh='';for(const t of ts){dl+=t.rateDownload;ul+=t.rateUpload;if(t.rateDownload>0||t.rateUpload>0)active++;let seeds=0,leechers=0;(t.trackerStats||[]).forEach(x=>{seeds=Math.max(seeds,x.seederCount||0);leechers=Math.max(leechers,x.leecherCount||0)});if(t.percentDone>=1){done++;(t.files||[]).forEach(f=>fh+=`<div class="file-row"><span class="fname">${escapeHtml(f.name.split('/').pop())}</span><span class="fsize mono">${fmtBytes(f.length)}</span></div>`);continue}const pct=(t.percentDone*100).toFixed(1),paused=t.status===0;ah+=`<div class="torrent"><div class="row1"><div class="name">${escapeHtml(t.name)}</div><div class="pct mono">${pct}%</div></div><div class="track"><div class="fill ${paused?'paused':''}" style="width:${pct}%"></div></div><div class="meta"><span>${STATUS_MAP[t.status]||'Unknown'}</span><span class="dl">↓ <b class="mono">${fmtSpeed(t.rateDownload)}</b></span><span class="ul">↑ <b class="mono">${fmtSpeed(t.rateUpload)}</b></span><span>Peers: <b>${t.peersConnected}</b></span><span>Seeds: <b>${seeds}</b> · Leechers: <b>${leechers}</b></span><span class="mono">${fmtBytes(t.downloadedEver)} / ${fmtBytes(t.sizeWhenDone)}</span>${t.error?`<span style="color:var(--red)">${escapeHtml(t.errorString)}</span>`:''}<span class="actions"><button onclick="pauseResume(${t.id},${paused})">${paused?'Resume':'Pause'}</button><button class="danger" onclick="removeTorrent(${t.id},false)">Remove</button><button class="danger" onclick="removeTorrent(${t.id},true)">Remove + files</button></span></div></div>`}document.getElementById('torrent-list').innerHTML=ah||'<div class="empty">No torrents downloading right now.</div>';document.getElementById('finished-list').innerHTML=fh||'<div class="empty">No completed files yet.</div>';document.getElementById('stat-dl').textContent=fmtSpeed(dl);document.getElementById('stat-ul').textContent=fmtSpeed(ul);document.getElementById('stat-active').textContent=active;document.getElementById('stat-done').textContent=done}
let watchedPaths=JSON.parse(localStorage.getItem('watched_paths')||'null');async function initDiskPaths(){try{const s=await rpcCall('session-get',{}),d=s['download-dir'];if(!watchedPaths){watchedPaths=[d];localStorage.setItem('watched_paths',JSON.stringify(watchedPaths))}}catch(e){}renderDiskSelect()}function renderDiskSelect(){const s=document.getElementById('disk-select');s.innerHTML=(watchedPaths||[]).map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')+`<option value="__add__">+ Add another path…</option>`}function onDiskChange(){const s=document.getElementById('disk-select');if(s.value==='__add__'){const p=prompt('Mounted folder path, e.g. /downloads');if(p){watchedPaths.push(p);localStorage.setItem('watched_paths',JSON.stringify(watchedPaths));renderDiskSelect();s.value=p}else s.selectedIndex=0}refreshStorage()}async function refreshStorage(){const s=document.getElementById('disk-select'),p=s.value&&s.value!=='__add__'?s.value:(watchedPaths||[])[0];if(!p)return;document.getElementById('storage-path').textContent=p;try{const r=await rpcCall('free-space',{path:p}),free=r['size-bytes'];document.getElementById('storage-detail').textContent='Free space: '+fmtBytes(free);const fill=document.getElementById('storage-fill'),gb=free/1e9;let pct=gb<5?95:gb<20?75:gb<100?40:15;fill.style.width=pct+'%';fill.className='fill'+(gb<20?' warn':'')}catch(e){document.getElementById('storage-detail').textContent='Could not read free space for this path.'}}
async function refreshAll(){await refreshTorrents();await refreshStorage()}initDiskPaths().then(refreshAll);setInterval(()=>{if(!pendingTorrent)refreshAll()},2000);
</script></body></html>
