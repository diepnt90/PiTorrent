events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server {
    listen 8080;
    server_name _;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index app.html;

    location = /manifest.json {
      proxy_pass http://addon:7000/manifest.json;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /stream/ {
      proxy_pass http://addon:7000;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /subtitles/ {
      proxy_pass http://addon:7000;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /subtitle-api {
      proxy_pass http://addon:7000;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /subtitle-files/ {
      proxy_pass http://addon:7000;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /player-subtitle {
      proxy_pass http://addon:7000/player-subtitle;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /addon-health {
      proxy_pass http://addon:7000/health;
      proxy_set_header Host $host:$server_port;
    }

    location /media/ {
      alias /downloads/complete/;
      autoindex off;
      add_header Access-Control-Allow-Origin * always;
      add_header Accept-Ranges bytes always;
    }

    location /transmission/rpc {
      proxy_pass http://transmission:9091/transmission/rpc;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass_request_headers on;
    }

    location = /app.html {
      sub_filter '</body>' '<script src="/subtitle-safari-fix.js"></script></body>';
      sub_filter_once on;
    }

    location / {
      try_files $uri $uri/ /app.html;
    }
  }
}
